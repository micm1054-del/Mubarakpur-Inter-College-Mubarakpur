<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M P INTER COLLEGE Result</title>

<style>

/* Body */

body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#f1f3f4;
}

/* Main Container */

.container{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:120px;
    box-sizing:border-box;
}

/* Heading */

.title{
    font-size:45px;
    font-weight:bold;
    color:#1a73e8;
    margin-bottom:40px;
    text-align:center;
}

/* Search Box */

.search-box{
    width:90%;
    max-width:850px;
    background:white;
    border-radius:50px;
    display:flex;
    align-items:center;
    padding:18px 25px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

/* Search Icon */

.search-icon{
    font-size:28px;
    color:#666;
}

/* Input */

.search-box input{
    flex:1;
    border:none;
    outline:none;
    background:none;
    font-size:24px;
    padding-left:15px;
}

/* Search Button */

.search-btn{
    margin-top:35px;
}

.search-btn button{
    background:#1a73e8;
    color:white;
    border:none;
    padding:16px 40px;
    border-radius:35px;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
}

.search-btn button:hover{
    background:#1665c0;
}

/* Result Container */

#resultContainer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-top:50px;
    text-align:center;
}

/* Result Image */

#resultImage{
    max-width:90%;
    display:none;
    margin:auto;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,0.12);
}

/* Download Button */

#downloadBtn{
    display:none;
    margin-top:25px;
    background:#16a34a;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

#downloadBtn:hover{
    background:#12813a;
}

/* Mobile Responsive */

@media(max-width:768px){

.container{
    padding-top:90px;
}

.title{
    font-size:30px;
}

.search-box{
    padding:14px 18px;
}

.search-box input{
    font-size:18px;
}

.search-btn button{
    font-size:18px;
    padding:14px 30px;
}

#downloadBtn{
    font-size:17px;
}

}

</style>

</head>

<body>

<div class="container">

    <!-- Heading -->

    <div class="title">
        M P INTER COLLEGE
    </div>

    <!-- Search Box -->

    <div class="search-box">

        <div class="search-icon">
            🔍
        </div>

        <input 
            type="text"
            id="searchInput"
            placeholder="Enter Aadhaar Last 6 Digits"
        >

    </div>

    <!-- Search Button -->

    <div class="search-btn">

        <button onclick="searchResult()">
            Search
        </button>

    </div>

    <!-- Result Area -->

    <div id="resultContainer">

        <img id="resultImage">

        <br>

        <a id="downloadLink" download>

            <button id="downloadBtn">
                Download
            </button>

        </a>

    </div>

</div>

<script>

/*

FOLDER STRUCTURE:

project-folder
│
├── index.html
│
└── results
      ├── 123456.jpg
      ├── 654321.jpg
      ├── 987654.jpg

Image name = Aadhaar last 6 digits

*/

function searchResult(){

    let input = document.getElementById("searchInput").value.trim();

    // Empty Check

    if(input == ""){

        alert("Enter Aadhaar Last 6 Digits");

        return;

    }

    // Elements

    let resultImage = document.getElementById("resultImage");

    let downloadBtn = document.getElementById("downloadBtn");

    let downloadLink = document.getElementById("downloadLink");

    // Image Path

    let imagePath = "./results/" + input + ".jpg";

    // Check Image Exists

    let testImage = new Image();

    // If Found

    testImage.onload = function(){

        resultImage.src = imagePath;

        resultImage.style.display = "block";

        downloadBtn.style.display = "inline-block";

        downloadLink.href = imagePath;

    };

    // If Not Found

    testImage.onerror = function(){

        alert("No Data Found");

        resultImage.style.display = "none";

        downloadBtn.style.display = "none";

    };

    testImage.src = imagePath;

}

</script>

</body>
</html>
